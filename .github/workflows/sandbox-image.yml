name: sandbox-image

# Publishes the agents' sandboxed computer image (sandbox/desktop/Dockerfile)
# to GitHub's container registry, where the engine pulls it on first use
# (cognitrix/computer/sandbox/client.py, IMAGE).
on:
  push:
    branches: [main]
    paths:
      - 'sandbox/desktop/**'
      - 'cognitrix/computer/**'
      - '.github/workflows/sandbox-image.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cognitrix-desktop
          tags="$image:latest,$image:sha-${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "release" ]; then tags="$tags,$image:${{ github.event.release.tag_name }}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/desktop/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

name: sandbox-image

# Publishes the agents' sandboxed computer image (sandbox/desktop/Dockerfile)
# to GitHub's container registry, where the engine pulls it on first use
# (cognitrix/computer/sandbox/client.py, IMAGE).
on:
  push:
    branches: [main]
    paths:
      - 'sandbox/desktop/**'
      - 'cognitrix/computer/**'
      # The image carries the app's CLI at the package's version (see the
      # Dockerfile), so a version bump rebuilds it.
      - 'pyproject.toml'
      - '.github/workflows/sandbox-image.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      no_cache:
        description: Rebuild every layer (picks up Debian, npm and pip updates; everyone downloads the whole image again)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cognitrix-desktop
          tags="$image:latest,$image:sha-${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "release" ]; then tags="$tags,$image:${{ github.event.release.tag_name }}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "cache=$image:buildcache" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = \"\(.*\)\"/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"
      # Layers whose inputs didn't change come from the build cache, so they
      # keep the same digest and people's computers don't download them again
      # (the image is ~3.6 GB; a version bump changes only the last few small
      # layers, see the Dockerfile). Without the cache every layer was rebuilt
      # and everyone re-downloaded the whole image on each bump. The cache
      # lives next to the image as the :buildcache tag (both platforms, all
      # stages).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/desktop/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            COGNITRIX_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}

name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --tag cognitrix:test .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with dev
      # Non-blocking until the repo-wide lint cleanup lands (see plan M3.1);
      # remove continue-on-error to make lint a hard gate afterwards.
      - name: Lint
        run: poetry run ruff check .
        continue-on-error: true
      - name: Test
        run: poetry run pytest -q

  # Type check, unit tests and a production build of the web app.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type check and build
        run: pnpm run build

  # Windows pipes and files default to cp1252, which is where the
  # "'charmap' codec can't encode" tool failures came from. Runs the tests that
  # cover tool calls and text encoding on a real Windows interpreter.
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with dev
      - name: Test
        run: poetry run pytest -q tests/test_windows_encoding.py tests/test_agent_tools.py tests/test_turn_loop.py tests/test_shell_tool.py tests/test_background_computer_use.py
      # Background computer use against real Notepad/Calculator/Explorer windows.
      # Hosted runners may lack some apps or an interactive desktop, so this
      # step reports but doesn't fail the job.
      - name: Background computer use (live desktop)
        continue-on-error: true
        env:
          COGNITRIX_LIVE_DESKTOP: '1'
        run: poetry run pytest -q -rs tests/test_background_computer_use_live.py

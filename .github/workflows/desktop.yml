name: desktop

# Builds the desktop app for Windows, Linux and macOS:
# React UI -> PyInstaller engine -> Tauri app.
# Each OS uploads its installers as a "cognitrix-<os>" artifact, and attaches
# them to the GitHub release when a release is published.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'cognitrix/desktop.py'
      - 'cognitrix/celery_worker.py'
      - '.github/workflows/desktop.yml'
  release:
    types: [published]

permissions:
  contents: write  # attach installers to a release; other events only read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            bundles: nsis,msi
            files: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: linux
            # The oldest supported Ubuntu, so the app runs on older glibc too.
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
            files: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/rpm/*.rpm
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos
            # Apple silicon. PyInstaller can't cross-build, so Intel Macs
            # would need an Intel runner.
            runner: macos-latest
            bundles: app,dmg
            files: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install . pyinstaller

      - name: Build UI and engine
        run: python desktop/scripts/build_engine.py

      - name: Smoke-test the engine
        run: python desktop/scripts/smoke_engine.py

      - name: Let the AppImage bundler find the engine's libraries
        if: runner.os == 'Linux'
        # linuxdeploy checks every ELF file in the bundle, including the
        # engine's own vendored .so files (pillow.libs, numpy.libs, ...),
        # and fails if it can't resolve them from the system paths.
        run: |
          dirs=$(find "$PWD/desktop/src-tauri/engine" -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)
          echo "LD_LIBRARY_PATH=$dirs" >> "$GITHUB_ENV"

      - name: Build installers
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: cognitrix-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ matrix.files }}
        run: |
          shopt -s nullglob
          files=()
          for pattern in $FILES; do files+=($pattern); done
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"

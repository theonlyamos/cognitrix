name: desktop

# Builds the desktop app for Windows, Linux and macOS:
# React UI -> PyInstaller engine -> Tauri app.
# Each OS uploads its installers as a "cognitrix-<os>" artifact, and attaches
# them to the GitHub release when a release is published.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'cognitrix/desktop.py'
      - 'cognitrix/celery_worker.py'
      - '.github/workflows/desktop.yml'
  release:
    types: [published]

permissions:
  contents: write  # attach installers to a release; other events only read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            bundles: nsis,msi
            files: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: linux
            # The oldest supported Ubuntu, so the app runs on older glibc too.
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
            files: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/rpm/*.rpm
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: macos
            # Apple silicon. PyInstaller can't cross-build, so Intel Macs
            # would need an Intel runner.
            runner: macos-latest
            bundles: app,dmg
            files: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install . pyinstaller

      - name: Build UI and engine
        run: python desktop/scripts/build_engine.py

      - name: Smoke-test the engine
        run: python desktop/scripts/smoke_engine.py

      - name: Build installers
        working-directory: desktop
        shell: bash
        env:
          # Self-update: with the signing key (a secret) and its public half
          # (a repository variable) set, the build also makes signed update
          # files and the app can update itself. Without them the build is
          # the same as before and the app says it can't self-update.
          UPDATE_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          npm ci --no-audit --no-fund
          config=()
          if [ -n "$UPDATE_SIGNING_KEY" ] && [ -n "$UPDATE_PUBLIC_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATE_SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATE_SIGNING_KEY_PASSWORD"
            printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}' "$UPDATE_PUBLIC_KEY" > updater.conf.json
            config=(--config updater.conf.json)
          else
            echo "::notice::No update signing key is set, so this build can't update itself (see desktop/README.md)."
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            # linuxdeploy (AppImage) checks every ELF file in the bundle,
            # including the engine's vendored .so files (pillow.libs,
            # numpy.libs, ...), and fails if it can't resolve them. Only this
            # command sees the extra path.
            export LD_LIBRARY_PATH=$(find "$PWD/src-tauri/engine" -name '*.so*' -printf '%h\n' | sort -u | paste -sd:)
          fi
          npx tauri build --bundles ${{ matrix.bundles }} "${config[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: cognitrix-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ matrix.files }}
        run: |
          shopt -s nullglob
          files=()
          for pattern in $FILES; do files+=($pattern); done
          # Signed update files, when this build made them.
          while IFS= read -r file; do files+=("$file"); done < <(
            find desktop/src-tauri/target/release/bundle -type f \( -name '*.sig' -o -name '*.app.tar.gz' \))
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber --repo "${{ github.repository }}"

  # Installed apps read latest.json from the newest release to learn that a
  # newer version exists. It lists the signed installers the builds attached.
  update-manifest:
    name: update manifest
    needs: build
    if: always() && github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir sigs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs || true
          if ! ls sigs/*.sig >/dev/null 2>&1; then
            echo "::notice::This release has no signed installers, so no update manifest was published."
            exit 0
          fi
          python3 desktop/scripts/make_update_manifest.py "$TAG" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" sigs
          gh release upload "$TAG" sigs/latest.json --clobber --repo "$GITHUB_REPOSITORY"

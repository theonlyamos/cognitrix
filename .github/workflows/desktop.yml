name: desktop

# Builds the Windows installer: React UI -> PyInstaller engine -> Tauri app.
# The installers are uploaded as the "cognitrix-windows" artifact of each run,
# and attached to the GitHub release when a release is published.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'cognitrix/desktop.py'
      - 'cognitrix/celery_worker.py'
      - '.github/workflows/desktop.yml'
  release:
    types: [published]

permissions:
  contents: write  # attach installers to a release; other events only read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install . pyinstaller

      - name: Build UI and engine
        run: python desktop/scripts/build_engine.py

      - name: Smoke-test the engine
        shell: pwsh
        run: |
          $engine = Start-Process -FilePath desktop/src-tauri/engine/cognitrix-engine.exe `
            -ArgumentList 'engine','--port','48299' -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:48299/home -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $engine.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:USERPROFILE/.cognitrix/celery-queue/worker.log" -ErrorAction SilentlyContinue; throw 'engine did not serve the UI' }

      - name: Build installer
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cognitrix-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Attach installers to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe, desktop/src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName)
          gh release upload "${{ github.event.release.tag_name }}" @files --clobber --repo "${{ github.repository }}"

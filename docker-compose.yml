# Cognitrix: web (FastAPI + in-process scheduler) + dedicated Celery worker,
# with Redis as the broker. Web and worker share the SQLite app DB over a named
# volume mounted at /home/cognitrix/.cognitrix. The containers run as the
# unprivileged "cognitrix" user; the entry script hands the volume to it.
#
#   docker compose up --build
#
# Nothing to set beforehand: keys are made on first start and everything else
# is in the app (Settings). The commands below point the app at the Redis
# container the first time; after that it can be changed in Settings > Advanced.
#
# Scale execution with `docker compose up --scale worker=3`. Keep web at a
# SINGLE replica: the schedule tick loop is per-process, so two web containers
# would fire due schedules twice.

x-app: &app
  image: cognitrix:latest
  # Older setups kept JWT_SECRET_KEY / COGNITRIX_SECRETS_KEY here. They are
  # copied into the data volume on first start; after that this file can go.
  env_file:
    - path: .env
      required: false
  volumes:
    - cognitrix-data:/home/cognitrix/.cognitrix  # settings, SQLite DB, keys, mcp.json
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    <<: *app
    build: .
    # A saved Redis queue flips both processes to it (the web container then
    # treats its local-worker spawn as a no-op).
    command: ["sh", "-c", "cognitrix settings set --if-unset CELERY_BROKER_URL=redis://redis:6379/0 && exec cognitrix --ui web"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  worker:
    <<: *app
    command: ["sh", "-c", "cognitrix settings set --if-unset CELERY_BROKER_URL=redis://redis:6379/0 && exec celery -A cognitrix.celery_worker worker --pool=solo --loglevel=info"]

volumes:
  redis-data:
  cognitrix-data:
